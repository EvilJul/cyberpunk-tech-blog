  responses:
    Error400:
      description: 格式错误、无 Idempotency-Key、条件格式错误或两类条件同时出现
      headers:
        X-Request-ID: *id001
        Cache-Control: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: 凭据无效、到期、已撤销或集成停用；Cookie/JWT 无效
      headers:
        X-Request-ID: *id001
        Cache-Control: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: scope 不足
      headers:
        X-Request-ID: *id001
        Cache-Control: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: 不存在或不属当前集成；功能关闭时亦 404
      headers:
        X-Request-ID: *id001
        Cache-Control: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: SLUG_CONFLICT / IDEMPOTENCY_CONFLICT / REQUEST_IN_PROGRESS
      headers:
        X-Request-ID: *id001
        Cache-Control: *id002
        Retry-After:
          description: 秒；409 仅 REQUEST_IN_PROGRESS 返回
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error410:
      description: ARTICLE_GONE：已删除来源映射，不能自动重建
      headers:
        X-Request-ID: *id001
        Cache-Control: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error412:
      description: REVISION_CONFLICT：旧版本或创建条件命中现有映射
      headers:
        X-Request-ID: *id001
        Cache-Control: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error413:
      description: 超过 JSON 2 MiB、正文 1 MiB 或文件 5 MiB
      headers:
        X-Request-ID: *id001
        Cache-Control: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error415:
      description: 不支持的媒体类型或伪 MIME
      headers:
        X-Request-ID: *id001
        Cache-Control: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error422:
      description: 字段校验失败、未知字段或非法分页
      headers:
        X-Request-ID: *id001
        Cache-Control: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error428:
      description: PRECONDITION_REQUIRED：缺少必要条件
      headers:
        X-Request-ID: *id001
        Cache-Control: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error429:
      description: 请求限流
      headers:
        X-Request-ID: *id001
        Cache-Control: *id002
        Retry-After:
          description: 秒；409 仅 REQUEST_IN_PROGRESS 返回
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error500:
      description: 内部错误；不缓存失败
      headers:
        X-Request-ID: *id001
        Cache-Control: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
